<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WSocket Lab</title><style>body{margin:0;background:#0b1020;color:#e7edf8;font:15px/1.5 system-ui;padding:24px}main{max-width:1000px;margin:auto}h1{font-size:38px;margin:0}.muted{color:#91a0b9}.panel{background:#121a2d;border:1px solid #26334d;border-radius:14px;padding:16px;margin:14px 0}label{display:block;color:#91a0b9;margin:10px 0 4px}input,textarea,select{width:100%;box-sizing:border-box;background:#080e1a;color:#e7edf8;border:1px solid #33415d;border-radius:8px;padding:10px}button{background:linear-gradient(110deg,#7c3aed,#0891b2);border:0;border-radius:8px;padding:10px 14px;color:white;cursor:pointer;margin:6px 4px 6px 0}pre{white-space:pre-wrap;background:#080e1a;padding:12px;border-radius:8px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.status{color:#67e8a5}</style><main><h1>WSocket Lab</h1><p class="muted">Connect to an authorized WebSocket endpoint and inspect messages.</p><section class="panel"><label>WebSocket URL</label><input id="url" value="wss://echo.websocket.events"><button id="connect">Connect</button><button id="close" disabled>Disconnect</button><span id="state" class="status">Disconnected</span></section><section class="panel"><label>Message</label><textarea id="payload">Hello from WSocket Lab</textarea><button id="send" disabled>Send</button><button id="clear">Clear log</button><pre id="log">Ready. Use endpoints you are authorized to access.</pre></section></main><script>let ws;const $=id=>document.getElementById(id);function state(s){$('state').textContent=s;$('connect').disabled=s==='Connected';$('close').disabled=s!=='Connected';$('send').disabled=s!=='Connected'}function log(k,v){$('log').textContent+='\n['+new Date().toLocaleTimeString()+'] '+k+': '+v}$('connect').onclick=()=>{try{const u=new URL($('url').value);if(!['ws:','wss:'].includes(u.protocol))throw Error('Use ws:// or wss://');ws=new WebSocket(u);state('Connecting');ws.onopen=()=>{state('Connected');log('OPEN',u.href)};ws.onmessage=e=>log('MESSAGE',typeof e.data==='string'?e.data:'Binary frame received');ws.onerror=()=>log('ERROR','Connection failed');ws.onclose=e=>{state('Disconnected');log('CLOSE','code '+e.code)}}catch(e){log('ERROR',e.message)}};$('close').onclick=()=>ws?.close(1000,'Closed by user');$('send').onclick=()=>{if(ws?.readyState===1){ws.send($('payload').value);log('SENT',$('payload').value)}};$('clear').onclick=()=>$('log').textContent='Log cleared.';</script></html>
